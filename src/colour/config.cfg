[project]
seed = 42

[data]
csv_path = datasets/nrc-emo-color/vad_rgb_dataset.csv
num_workers = 0

[model]
hidden_dim = 64
depth = 2
dropout = 0.0

[train]
batch_size = 16
epochs = 200
learning_rate = 0.001

[split]
train_split = 0.8
val_split = 0.1
test_split = 0.1

[colour_bias]
base_low = 40.0
base_high = 150.0
rank_bonuses = 30.0, 0.0, -50.0
variance_alpha = 0.4
spread_gain = 130.0