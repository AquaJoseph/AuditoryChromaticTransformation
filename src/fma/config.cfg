[project]
seed = 42

[bert]
name = bert-large-uncased

[infer]
batch_size = 32

[data]
npz_path = datasets\fma\mel_vad_dataset.npz
num_workers = 0
test_split = 0.2

[tokenizer]
token_width = 45
stride = 15
max_tokens = 128
random_crop = true
pad_value = -80.0

[cnn_encoder]
channels = 1,16,32,64,128
d_model = 256

[transformer]
nhead = 8
num_layers = 4
dim_feedforward = 512
dropout = 0.1
max_len = 5000

[train]
batch_size = 24
epochs = 15
learning_rate = 0.0001
weight_decay = 0.0001
gradient_clip = 1.0
shuffle = true
log_every = 10
save_every = 10

[optimizer]
name = adamw
betas = 0.9,0.999
eps = 1e-8

[loss]
name = hybrid
use_diversity = true
use_affinity = true

[loss.diversity]
weight = 0.25

[loss.affinity]
weight = 0.25

[loss.vad]
weight = 0.5